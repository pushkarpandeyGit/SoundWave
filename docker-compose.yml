version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: soundwave-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: soundwave-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: soundwave-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/soundwave
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=soundwave_super_secret_jwt_key_2026
    depends_on:
      - mongodb
      - redis

  frontend:
    build: ./frontend
    container_name: soundwave-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data: